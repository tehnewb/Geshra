name: Stage Maven Central release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stage
        required: true
        default: '1.0.0'
      group:
        description: Verified Maven Central namespace
        required: true
        default: io.github.albertbeaupre
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      LIBRARY_GROUP: ${{ inputs.group }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release inputs
        shell: bash
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || [[ "$RELEASE_VERSION" == *SNAPSHOT* ]]; then
            echo "A valid release version is required."
            exit 1
          fi
          [[ "$LIBRARY_GROUP" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]
      - name: Build and stage signed publication
        run: bash ./gradlew clean build publishToMavenCentral "-PreleaseVersion=$RELEASE_VERSION" "-PlibraryGroup=$LIBRARY_GROUP" -PreleaseSigning=true --console=plain
