name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and publish locally
        run: bash ./gradlew clean build publishAllPublicationsToBuildRepository publishToMavenLocal --console=plain
      - name: Test Gradle consumer
        run: bash ./gradlew -p examples/spring-app -PuseBuildRepository=true clean test bootJar --console=plain
      - name: Test Maven consumer
        run: mvn -B -f examples/spring-app/pom.xml clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - name: Install test browsers
        working-directory: browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Check native UI in browsers
        run: |
          java -jar examples/spring-app/build/libs/geshra-spring-example.jar --demo.password=browser-test-password > build/browser-example.log 2>&1 &
          example_pid=$!
          trap 'kill "$example_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4040/components > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix browser-tests test
          BROWSER=firefox npm --prefix browser-tests test
