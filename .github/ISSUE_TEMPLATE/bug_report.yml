name: Bug report
description: Report a reproducible problem in Geshra.
body:
  - type: input
    id: version
    attributes:
      label: Geshra version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or minimal example
      description: Include the expected behavior and what actually happens.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Java, Spring Boot, operating system, and browser versions as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and session tokens before sharing logs.
      render: text
